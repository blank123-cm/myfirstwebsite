<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>FitTrack | Register</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body class="auth">
    <section class="hero">
      <a class="brand" href="index.html"><b>F</b> FitTrack</a>
      <div>
        <small>START WHERE YOU ARE</small>
        <h1>Your journey<br /><em>starts today.</em></h1>
        <p>Create your profile and make every workout count.</p>
      </div>
      <footer>Progress, not perfection.</footer>
    </section>

    <main class="authbox">
      <div class="mobilebrand">🟣 FitTrack</div>
      <small>JOIN FITTRACK</small>
      <h2>Create your account</h2>

      <form id="registerForm">
        <label>Full name</label>
        <input id="name" required placeholder="Your full name" />

        <label>Email address</label>
        <input id="regEmail" type="email" required placeholder="you@example.com" />

        <label>Password</label>
        <input id="regPass" type="password" minlength="6" required placeholder="At least 6 characters" />

        <label>Confirm password</label>
        <input id="confirmPass" type="password" minlength="6" required placeholder="Re-enter password" />

        <button class="primary">Create account →</button>
      </form>

      <p class="switch">Already registered? <a href="index.html">Sign in</a></p>
      <p class="note">Demo only; account details are not saved.</p>
    </main>

    <script src="js/app.js"></script>
  </body>
</html>
